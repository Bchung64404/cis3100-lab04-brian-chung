version: '3.8'

services:
  # Nginx Web Server
  web-server:
    image: nginx:latest
    container_name: lab_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
    restart: always

# PHP-FPM Service
  php-app:
    image: php:8.2-fpm  
    container_name: lab_php
    command: sh -c "php -m | grep -q pdo_mysql || docker-php-ext-install pdo pdo_mysql; php-fpm"
    volumes:
      - ./www:/var/www/html
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - database
    restart: always


  # MySQL Database Service
  database:
    image: mysql:8.0
    container_name: lab_mysql  # Matches $host = 'database' in db.php
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always